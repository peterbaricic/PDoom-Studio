<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>P(doom) player</title>
<style>
  html, body { margin: 0; background: #1b1820; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; max-width: 1280px; }
  #view { width: 100%; aspect-ratio: 16 / 9; height: auto; background: #F3EBDC; display: block; }
  .bar { display: flex; gap: 10px; align-items: center; }
  #play, #playnow { min-width: 120px; padding: 5px 12px; font: inherit; white-space: nowrap; }
  #time { font-variant-numeric: tabular-nums; min-width: 110px; }
  #seek { flex: 1; height: 18px; cursor: pointer; touch-action: none; border-radius: 3px; }
  #state { font-weight: 600; }
  #stats { color: #a9a3b3; font-variant-numeric: tabular-nums; }
  .ok { color: #8fd18a; } .wait { color: #f2c46d; } .bad { color: #f28b82; }
  #workers { position: fixed; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }
  #workers iframe { width: 1300px; height: 800px; border: 0; }
</style>
</head>
<body>
<main>
  <canvas id="view" width="1280" height="720"></canvas>
  <div class="bar">
    <button id="play">Play</button>
    <button id="playnow" hidden title="Plays what's rendered, then waits until the rest can play without stopping">Play now</button>
    <span id="time">0:00 / 2:36</span>
    <canvas id="seek" height="18"></canvas>
  </div>
  <div id="state">Starting renderers…</div>
  <div id="stats"></div>
  <audio id="song" src="assets/pdoom.mp3" preload="auto"></audio>
</main>
<div id="workers"></div>
<script src="src/watch.js"></script>
</body>
</html>
